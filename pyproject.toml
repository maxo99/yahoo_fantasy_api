[project]
name = "yahoo_fantasy_api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "docopt>=0.6.2",
    "objectpath>=0.6.1",
    "pytz>=2025.2",
    "yahoo-oauth>=2.1.1",
]

[dependency-groups]
dev = [
    # Testing
    "pytest",
    "mock>=5.2.0",
    # Experimentation
    "ipykernel",
    "pandas",
    # Document generation
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.0.2",
]


[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"


[tool.setuptools.packages.find]
where = ['src']
include = ['yahoo_fantasy_api*']


[tool.uv.sources]
yahoo_fantasy_api = {  workspace = true }

# [tool.uv.workspace]
# members = [
#     "yahoo_fantasy_api",
#     "yahoo_fantasy_api/scripts",

# ]



[tool.pyright]
include = ["src", "tests"]
exclude = []

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]


[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"